<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>Pokemons</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary indie-flower-nav">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">2 DS PROJETO</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
              <a class="nav-link" aria-current="page" href="register.html">Registro de treinadores</a>
              <a class="nav-link" href="battle.html">Batalha</a>
              <a class="nav-link" href="display.html">Menu de Treinadores</a>
            </div>
          </div>
        </div>
      </nav>
    <h1 class="indie-flower-bold text-center">Poke API</h1>
    <div class="mb-3 indie-flower-regular">
        <div class="mb-3 indie-flower-bold text-center ">Time 1</div>
        <label for="pokemonTeam1" class="form-label">Nome do pokemon: </label>
        <input type="text" class="form-control" name="pokemonTeam1" id="pokemonTeam1" autocomplete="off" required placeholder="Umbreon, Pikachu...">
    </div>
    <div class="justify-content-center text-center row">
        <div class="mb-3 indie-flower-regular">HP DO POKEMON SELECIONADO</div>
        <progress class="mb-3" id="pokemonHpTeam1" value="0" max="100"></progress>
    </div>
    <div class="mb-3 d-flex justify-content-center">
        <button class="btn btn-primary" onclick="addPokemonT1()">Buscar</button>
    </div>
    <div class="row mb-3" id="pokemonTeam1Zone"></div>

    <div class="mb-3 indie-flower-regular">
        <div class="mb-3 indie-flower-bold text-center ">Time 2</div>
        <label for="pokemonTeam2" class="form-label">Nome do pokemon: </label>
        <input type="text" class="form-control" name="pokemonTeam2" id="pokemonTeam2" autocomplete="off" required placeholder="Umbreon, Pikachu...">
    </div>
    <div class="justify-content-center text-center row">
        <div class="mb-3 indie-flower-regular">HP DO POKEMON SELECIONADO</div>
        <progress class="mb-3" id="pokemonHpTeam2" value="0" max="100"></progress>
    </div>
    <div class="mb-3 d-flex justify-content-center">
        <button class="btn btn-primary" onclick="addPokemonT2()">Buscar</button>
    </div>
    <div class="row mb-3" id="pokemonTeam2Zone"></div>

    <div class="mb-3">
        <div class="row mb-3"><button class="btn btn-primary" onclick="pokemonBattle()">Batalhar</button></div>
        <h1 class="indie-flower-bold text-center">Log de Batalha</h1>
        <div class="indie-flower-log" id="battleLog"></div>
        <h1 class="indie-flower-bold text-center">Resultado da Batalha</h1>
        <div class="indie-flower-win" id="battleResult"></div>
    </div>

    <script src="Pokemon.js"></script>
    <script src="Treinador.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>

</html>
