    <div class="mb-3"><h1 class="indie-flower-bold mt-3 text-center">Registro de treinadores</h1></div>
    <div class="mb-3 indie-flower-regular">
        <label for="trainerName" class="form-label">Nome do treinador: </label>
        <input type="text" class="form-control" name="trainerName" id="trainerName" autocomplete="off" required>
    </div>
    <br>
    <div class="mb-3 indie-flower-regular">
        <label for="trainerAge" class="form-label">Idade do treinador: </label>
        <input type="number" class="form-control" name="trainerAge" id="trainerAge" autocomplete="off" required>
    </div>
    <br>
    <div class="mb-3 indie-flower-regular">
        <label for="trainerCity" class="form-label">Cidade do treinador: </label>
        <input type="text" class="form-control" name="trainerCity" id="trainerCity" autocomplete="off" required>
    </div>
    <br>
    <div class="mb-3 d-flex justify-content-center">
        <button class="btn btn-primary indie-flower-bold" onclick="registerTrainer()">Registrar</button>
    </div>

    <script src="Pokemon.js"></script>
