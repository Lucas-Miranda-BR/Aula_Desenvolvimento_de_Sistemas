<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
</head>
<body>
        <fieldset>
            <legend>Rest Countries API</legend>
            <label for="input-search">Nome do país: </label>
            <input type="text" name="input-search" id="input-search" required placeholder="Canada, Brazil, China...">
            <button onclick="fetchCountry()">Buscar país</button>
        </fieldset>

    <script>

        function fetchCountry() {
            let input_search = document.querySelector('#input-search');
            let country = input_search.value;
            let url = `https://restcountries.com/v3.1/name/${country}`;
            
            fetch(url)
            .then(convertData => convertData.json())
            .then(convertedData => {
                    console.log(convertedData)
                })
            .catch(unexpectedError => {
                    console.log(`Erro detectado: ${unexpectedError}`)
                })
            .finally(()=>{
                    console.log(`Requisição realizada com sucesso.`)
                });
        }
    </script>
</body>
</html>
