<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Indie+Flower&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="mb-3 indie-flower-regular">
                    <label for="pokemonName" class="form-label text-color-label">Nome do Pokemon</label>
                    <input type="text" class="form-control text-color-form" id="pokemonName" placeholder="Nome de pokemon" required autocomplete="off">
                </div>
                <div class="col-12 indie-flower-regular text-center mb-4">
                    <button type="submit" class="btn btn-color" onclick="fetchPokemon()">Buscar</button>
                </div>
            </div>
        </div>
    </div>

        <br>

        <h1 class="indie-flower-regular text-center mb-4 text-color">Galeria de Pokemon</h1>
        <br>
        <div class="container-fluid px-4">
            <div id="pokemonInfo" class="row g-4"></div>
        </div>

        <br>

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="mb-3 indie-flower-regular">
                    <label for="editPokemonId" class="form-label text-color-label">ID do pokemon que deseja editar</label>
                    <input type="number" class="form-control text-color-form" id="editPokemonId" placeholder="ID do pokemon" required autocomplete="off">
                </div>
                <div class="mb-3 indie-flower-regular">
                    <label for="editPokemonName" class="form-label text-color-label">Pokemon que deseja colocar</label>
                    <input type="text" class="form-control text-color-form" id="editPokemonName" placeholder="Nome do pokemon" required autocomplete="off">
                </div>
                <div class="col-12 indie-flower-regular text-center mb-4">
                    <button type="submit" class="btn btn-color" onclick="editPokemonData()">Editar</button>
                </div>
            </div>
        </div>

        <br>
        
        <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="mb-3 indie-flower-regular">
                    <label for="deletePokemonId" class="form-label text-color-label">ID do Pokemon que deseja deletar</label>
                    <input type="text" class="form-control text-color-form" id="deletePokemonId" placeholder="ID do pokemon" required autocomplete="off">
                </div>
                <div class="col-12 indie-flower-regular text-center mb-4">
                    <button type="submit" class="btn btn-color" onclick="deletePokemon()">Deletar</button>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>
</html>
