<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>While</title>
    <style>

        body{
            background-color: grey;
        }
        
    </style>
</head>
<body>
    

 <script>

    var num = 1;
    var i = 0;
    var sumPar = 0;

        while (num != 0) {

            i++
            num = parseInt(prompt(`(Loop num: ${i}) Insira um número: `));

            if(num%2==0) {
                sumPar += num;
            }
     }

    document.writeln(`Soma dos números pares: ${sumPar} <br>`);
    document.writeln(`Loops exectuados: ${i}`);

    </script>
</body>
</html>
