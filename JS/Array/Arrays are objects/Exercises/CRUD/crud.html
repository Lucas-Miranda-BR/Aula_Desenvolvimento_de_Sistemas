<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
</head>
<body>
    <fieldset>
        <legend>Cadastro de Jogos</legend>
        <label for="id">Código:</label>
        <input type="number" name="id" id="id" required autocomplete="off">
        <br>
        <label for="name">Nome:</label>
        <input type="text" name="name" id="name" required autocomplete="off">
        <br>
        <label for="developer">Desenvolvidor:</label>
        <input type="text" name="developer" id="developer" required autocomplete="off">
        <br>
        <button onclick="registerGame()">Cadastrar</button>
    </fieldset>

    <h1>Feedback de cadastramento de jogos</h1>
    <div id="feedbackGameResgistration">N/A</div>

    <h1>Galeria de jogos</h1>
    <div id="gameGalery"></div>

    <br>

    <fieldset>
        <legend>Exclusão de jogos</legend>
        <label for="removeGame"></label>
        <input type="number" name="removeGame" id="removeGame" placeholder="Remover jogo por ID." required autocomplete="off">
        <button onclick="gameRemoval()">Excluir</button>
    </fieldset>

    <h1>Feedback de exclusão de jogos</h1>
    <div id="feedbackGameRemoval">N/A</div>

    <br>

    <fieldset>
        <legend>Alteração de informações de um jogo</legend>
            <label for="editID">Código:</label>
            <input type="number" id="editID" name="editID" placeholder="Alterar jogo por ID." required autocomplete="off">
            <br>
            <label for="editName">Novo nome:</label>
            <input type="text" id="editName" name="editName" required autocomplete="off">
            <br>
            <label for="editDeveloper">Novo desenvolvidor:</label>
            <input type="text" id="editDeveloper" name="editDeveloper" required autocomplete="off">
            <br>
            <button onclick="editGameInfo()">Alterar</button>
        </fieldset>

        <h1>Feedback de alteração de jogo</h1>
        <div id="editResults">N/A</div>

    <script src="crud.js"></script>
</body>
</html>
