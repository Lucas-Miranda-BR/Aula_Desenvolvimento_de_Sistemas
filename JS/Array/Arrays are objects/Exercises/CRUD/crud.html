<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRUD</title>
    <link rel="stylesheet" href="crud.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>
<body>
    
    <fieldset>
        <legend>Cadastro de jogos</legend>

        <form action="crud.html" method="post">
            <label for="inputGameName">Nome do jogo:</label>
            <input type="text" name="inputGameName" id="inputGameName" required autocomplete="off" placeholder="Nome">
            <br>
            <label for="inputDeveloperTeam">Desenvolvedores:</label>
            <input type="text" name="inputDevelopers" id="inputDevelopers" required autocomplete="off" placeholder="Desenvolvedores">
            <br>
            <label for="inputPublisher">Publicadores:</label>
            <input type="text" name="publishers" id="publishers" required autocomplete="off" placeholder="Publicadores">
            <br>
            <label for="inputReleaseYear">Data de lançamento:</label>
            <input type="number" name="inputReleaseYear" id="inputReleaseYear" required autocomplete="off" placeholder="Ano">
            <br>
            <button onclick="registerGame()">Registrar jogo</button>
        </form>

    </fieldset>

    <br>

    <h1>Feedback de registramento de jogos</h1>
    <div id="gameRegistrationFeedback"></div>

    <br>

    <h1>Jogos registrados</h1>
    <div id="gameDisplay"></div>

    <br>

    <fieldset>
        <legend>Exclusão de jogos</legend>

        <form>
            <label for="removeGame">Remover jogo:</label>
            <input type="text" name="removeGame" id="removeGame" required autocomplete="off" placeholder="Nome">
            <button onclick="removeGame()">Remover</button>
        </form>

    </fieldset>

    <br>

    <h1>Feedback de remoção de jogos</h1>
    <div id="removeGame"></div>

    <script src="crud.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js" integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO" crossorigin="anonymous"></script>
</body>
</html>
