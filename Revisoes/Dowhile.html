<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do while rev</title>
    <style>

        body{
            background-color: grey;
        }

    </style>
</head>
<body>
    
    <script>

        var num;

        do {
            num = parseInt(prompt(`Digite um numero menor que 18`))
        } while (num < 18);

    </script>
    
</body>
</html>
